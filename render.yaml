# Blueprint Render per Steward.
#
# Avvio: Render → New → Blueprint → selezionare questo repository.
#
# Un solo servizio web: il backend Node, che serve **anche** il frontend
# compilato (`client/dist`) e l'API. Frontend e API sulla stessa origine è ciò
# che rende same-origin il cookie di refresh e risolve il login che si rifaceva
# a ogni avvio della PWA: vedi «Cookie di sessione e dominio» nel README.
#
# L'hostname reale del servizio è `steward-api-ef7e.onrender.com` (Render assegna
# i nomi su tutto onrender.com e `steward-api` era già occupato). Da quell'URL
# dipendono URL_FRONTEND (link di conferma email), URL_API e CORS_ORIGINS.
#
# Le variabili marcate `sync: false` non si possono valorizzare dal file: si
# inseriscono a mano nel pannello di Render (Render → service → Environment).
#
# ---- Limiti del piano free, e come questo blueprint li tiene conto ----
#
# * L'istanza free si addormenta dopo 15 minuti e ci mette circa un minuto a
#   risvegliarsi. Servendo il frontend dallo stesso servizio, si addormenta
#   anche lui: la prima apertura dopo un periodo di inattività attende il
#   risveglio. È il prezzo di restare senza un dominio custom. Per questo il
#   server ha timeout di connessione a MongoDB larghi (60 s): con i 10 s di
#   partenza l'avvio andava in crash loop finché Atlas non si svegliava.
#
# * Nessun health check. Un controllo periodico è una richiesta HTTP in arrivo,
#   e quindi tiene l'istanza sveglia consumando le 750 ore mensili del workspace:
#   un mese ha 744 ore, una sola istanza tenuta sempre accesa le usa tutte. Il
#   controllo non serve, perché Render riavvia comunque da solo un servizio free.
#   Se in futuro serve un monitor, il ping va dato con intervalli superiori ai
#   15 minuti.
#
# * Nessun disco persistente: non serve, gli allegati stanno in MongoDB.
#
# * `region` va confermata nella schermata di creazione: non tutte le regioni
#   sono offerte sul piano free. Se Francoforte non fosse disponibile, va cambiata
#   qui prima del primo deploy.
#
# * Il piano free non permette il dimensionamento oltre una singola istanza e
#   non riceve traffico di rete privata. Non serve: con un solo servizio non
#   c'è traffico fra servizi, e `CORS_ORIGINS` resta dichiarato per completezza
#   anche se il SPA è same-origin.

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: steward-api
    runtime: node
    plan: free # free | starter | standard | pro
    region: frankfurt # regione del datacenter, più vicina all'Europa
    # `branch` non è dichiarato di proposito: Render usa il ramo predefinito del
    # repository, che potrebbe non essere `main`.
    # `--include=dev` e' obbligatorio: NODE_ENV=production fa saltare a npm i
    # devDependencies, quindi tsc, @types/node e il bundler di Vite non
    # verrebbero installati e la build fallirebbe con "Cannot find type
    # definition file for 'node'". La build compila **server e client**: il
    # frontend finisce in `client/dist` e viene servito da questo servizio.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start --workspace server
    # Nessun `healthCheckPath`: vedi la nota sul piano free in testa al file.
    autoDeploy: true

    envVars:
      - key: NODE_VERSION
        # Alias di major, non versione esatta: se Render non avesse quella
        # patch precisa la build fallirebbe.
        value: "22"

      - key: NODE_ENV
        value: production

      # Render imposta PORT da solo: il server lo legge dalla configurazione.
      # Non va dichiarato qui, altrimenti si sovrappone a quello di Render.

      # ---- Segreti JWT ----
      # In produzione il server si rifiuta di avviare con i valori di
      # sviluppo, quindi vanno generati davvero. `generateValue` crea una
      # stringa casuale a ogni primo deploy.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d

      # ---- Cookie del refresh token ----
      # Il refresh token sta in un cookie `httpOnly` con `SameSite=Lax`, ed è
      # così che la PWA resta connessa fra un avvio e l'altro. Perché il browser
      # lo invii su `/auth/refresh` serve **same-origin**: il SPA è servito da
      # questo stesso servizio (`server/src/app.ts`), quindi il cookie parte e
      # la sessione dura i 7 giorni di `JWT_REFRESH_TTL`.
      #
      # Non usare `SameSite=None`: funzionerebbe solo dove i cookie di terze
      # parti sono ammessi, e Safari/iOS li bloccano, lasciando rotta la PWA
      # mobile. `COOKIE_DOMAIN` resta vuoto: il cookie è host-only e va bene.
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: lax

      # ---- URL del servizio ----
      # Frontend e API sono lo stesso host: `URL_FRONTEND` (link di conferma
      # email) e `URL_API` (base degli URL firmati degli allegati) coincidono.
      # `VITE_API_URL` non serve più: il client usa `/api` relativo (vedi
      # `client/src/api/client.ts`).
      - key: CORS_ORIGINS
        value: https://steward-api-ef7e.onrender.com
      - key: URL_FRONTEND
        value: https://steward-api-ef7e.onrender.com
      - key: URL_API
        value: https://steward-api-ef7e.onrender.com

      # ---- MongoDB Atlas ----
      # SRV: mongodb+srv://utente:password@cluster.xxxxx.mongodb.net/steward
      # La password va codificata: se contiene @ / : # / eccetera va messa in
      # forma %40 %2F %3A %23, altrimenti il parser la tronca.
      - key: MONGODB_URI
        sync: false

      # ---- Email (Brevo) ----
      # Senza BREVO_API_KEY l'app funziona ma non spedisce: la conferma degli
      # indirizzi resta da fare a mano.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_MITTENTE_EMAIL
        sync: false
      - key: BREVO_MITTENTE_NOME
        # Il nome che i gestori di posta mostrano come mittente. Brevo non lo
        # autentica, ma deve essere riconoscibile: è la prima cosa che vede chi
        # riceve l'email di conferma.
        value: Gestione Condomini - Steward Management System
